name: Sync legacy update endpoints

# Mirrors docs/latest-versions.json and docs/changelog.md from
# digitalhabits/dh-blocker into the old GitHub Pages paths that
# already-shipped clients still poll, because Pages URLs do not follow a
# repo rename or transfer:
#   redd-block/              <- clients <= v3.8.7 (repo was ulyngs/redd-block)
#   digital-habits-blocker/  <- clients v3.8.8–v3.8.11 (repo was
#                               ulyngs/digital-habits-blocker)
# Runs on a schedule because the main repo's GITHUB_TOKEN cannot push
# cross-repo; a release therefore reaches legacy clients within ~6 hours
# (or immediately via manual dispatch).

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current files from dh-blocker
        run: |
          set -euo pipefail
          SRC="https://raw.githubusercontent.com/digitalhabits/dh-blocker/main/docs"
          curl -fsSL -o /tmp/latest-versions.json "$SRC/latest-versions.json"
          curl -fsSL -o /tmp/changelog.md "$SRC/changelog.md"
          # Sanity check: never publish an empty/invalid manifest.
          python3 -c "import json; m = json.load(open('/tmp/latest-versions.json')); assert m.get('macos'), 'manifest missing macos version'"
          for dir in redd-block digital-habits-blocker; do
            mkdir -p "$dir"
            cp /tmp/latest-versions.json /tmp/changelog.md "$dir/"
          done

      - name: Commit if changed
        run: |
          set -euo pipefail
          git add redd-block/ digital-habits-blocker/
          if git diff --staged --quiet; then
            echo "Already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync legacy update endpoints from dh-blocker"
          git push
